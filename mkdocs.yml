site_name: Golem Robotics Research Curriculum
site_description: >-
  A paper-driven, experiment-centered curriculum for robot learning,
  embodied intelligence, and physical AI.

docs_dir: curriculum_and_progress
site_dir: site
use_directory_urls: true
strict: true

hooks:
  - hooks/build_curriculum_graph.py

theme:
  name: material
  language: en
  icon:
    logo: material/robot-industrial
    admonition:
      note: material/note-text
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path:
        - .
      check_paths: true
      restrict_base_path: true

extra_css:
  - stylesheets/extra.css
  - assets/stylesheets/curriculum_explorer.css

extra_javascript:
  - assets/javascripts/curriculum_explorer.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

copyright: Golem Robotics Paper Club
nav:
  - Explorer: index.md
  - Overview:
      - Documentation overview: overview.md
      - Operating principles: reference/operating_principles.md
      - Curriculum goal: reference/research_curriculum_goal.md
      - Curriculum construction rules: reference/research_curriculum_construction_rules.md
      - Topic planning guideline: reference/topic_planning_guideline.md
      - Repository structure: reference/repository_structure.md
  - Curriculum:
      - Curriculum map: curriculum_map.md
      - Curriculum table: curriculum_table.md
  - Topics:
      - Shared foundations:
