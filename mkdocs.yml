          - "L2 — Deep model-free continuous control": topics/l2_deep_model_free_continuous_control/topic_plan_and_session_timeline.md
          - "L3 — Imitation learning and inverse reinforcement learning": topics/l3_imitation_learning_and_inverse_reinforcement_learning/topic_plan_and_session_timeline.md
