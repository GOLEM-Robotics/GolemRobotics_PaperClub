          - "F5 — Foundation-model training, post-training, and adaptation": topics/f5_foundation_model_training_post_training_and_adaptation/topic_plan_and_session_timeline.md
          - "F6 — Robot mechanics, dynamics, and interaction control": topics/f6_robot_mechanics_dynamics_and_interaction_control/topic_plan_and_session_timeline.md
