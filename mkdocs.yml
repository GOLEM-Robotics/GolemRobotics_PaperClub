          - "F2 — Optimization and deep-learning mechanics": topics/f2_optimization_and_deep_learning_mechanics/topic_plan_and_session_timeline.md
          - "F3 — Neural architectures and sequence models": topics/f3_neural_architectures_and_sequence_models/topic_plan_and_session_timeline.md
