<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golem Curriculum — research learning workspace</title>
<meta name="description" content="{{ config.site_description }}">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="{{ base_url }}/assets/images/favicon.png">
<link rel="stylesheet" href="{{ base_url }}/assets/styles/app.css">
<script>
  (() => {
    try {
      const stored = localStorage.getItem("golem-theme");
      if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
      else document.documentElement.removeAttribute("data-theme");
    } catch { document.documentElement.removeAttribute("data-theme"); }
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to the main content</a>

<header class="topbar">
  <a class="brand" href="#/" data-nav>
    <span class="brand-mark" aria-hidden="true">G</span>
    <span class="brand-name">Golem Curriculum</span>
  </a>

  <nav class="mainnav" aria-label="Primary">
    <a href="#/" data-nav-match="plan">My plan</a>
    <a href="#/papers" data-nav-match="papers">Papers</a>
    <a href="#/curriculum" data-nav-match="curriculum">Curriculum</a>
    <a href="#/workspace" data-nav-match="workspace">Workspace</a>
    <a href="#/reference" data-nav-match="reference">Reference</a>
  </nav>

  <div class="topbar-tools">
    <button type="button" class="search-trigger" data-open-palette aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <span>Search everything</span>
      <kbd>Ctrl K</kbd>
    </button>
    <button type="button" class="profile-trigger" data-open-profile aria-haspopup="dialog">
      <span class="dot" aria-hidden="true"></span>
      <span data-profile-label>Guided</span>
    </button>
    <button type="button" class="icon-button" data-toggle-theme aria-label="Switch colour theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
  </div>
</header>

<div class="notice-bar" data-revision-notice role="status" hidden></div>

<main id="main" class="app-main" tabindex="-1" data-outlet>
  <div class="loading">Loading the curriculum…</div>
</main>

<nav class="tabbar" aria-label="Primary">
  <a href="#/" data-nav-match="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17l-7-4-7 4z"/><path d="m9 10 2 2 4-4"/></svg><span>My plan</span></a>
  <a href="#/papers" data-nav-match="papers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h7M9 16h7"/></svg><span>Papers</span></a>
  <a href="#/curriculum" data-nav-match="curriculum"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7v6H4zM13 5h7v6h-7zM4 13h7v6H4zM13 13h7v6h-7z"/></svg><span>Curriculum</span></a>
  <a href="#/workspace" data-nav-match="workspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v13H4z"/><path d="M9 7V4h6v3M4 12h16"/></svg><span>Workspace</span></a>
  <a href="#/reference" data-nav-match="reference"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/><path d="M8 7h7M8 11h7"/></svg><span>Reference</span></a>
</nav>

<div class="comparebar" data-comparebar hidden></div>
<div class="toast" data-toast role="status" aria-live="polite" hidden></div>
<div data-palette-root></div>
<dialog class="sheet" data-sheet aria-labelledby="sheet-title"></dialog>

<noscript>
  <div class="page page--narrow">
    <div class="card">
      <h1>JavaScript is required for the learning workspace</h1>
      <p class="prose">The complete canonical curriculum stays readable without it: the
        <a href="{{ base_url }}/curriculum_map/">curriculum map</a>,
        <a href="{{ base_url }}/curriculum_table/">curriculum table</a>,
        <a href="{{ base_url }}/paper_index/">paper index</a>,
        <a href="{{ base_url }}/supporting_materials_index/">supporting resources</a> and
        <a href="{{ base_url }}/frontier_watchlist/">frontier watchlist</a> are plain documents.</p>
    </div>
  </div>
</noscript>

<script type="module" src="{{ base_url }}/assets/app/main.js" data-graph-url="{{ base_url }}/assets/data/curriculum_graph.json" data-reference-base="{{ base_url }}/"></script>
</body>
</html>
