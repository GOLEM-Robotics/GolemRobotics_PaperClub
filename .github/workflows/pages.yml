name: Validate and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install viewer dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate curriculum data
        run: python -m unittest discover -s tests -v

      - name: Build viewer
        run: mkdocs build --strict

      - name: Install browser-test dependencies
        run: npm ci

      - name: Run the learner journey suite
        run: |
          # Serve from a subdirectory: a project GitHub Pages site lives at
          # /<repository>/, so testing at the server root would hide any
          # absolute-path regression.
          mkdir -p .pages-check
          cp -r site .pages-check/project
          python -m http.server 8001 --directory .pages-check &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:8001/project/ >/dev/null && break
            sleep 0.25
          done
          BASE_URL=http://127.0.0.1:8001/project npm run test:browser

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
